name: CI
on:
  push:
    branches: [master]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Check and build
        run: sh build.sh
      - name: Test with Node Web Storage enabled
        run: pnpm test
        env:
          NODE_OPTIONS: --experimental-webstorage
      - uses: actions/upload-artifact@v4
        if: matrix.node == '22'
        with:
          name: utools-funqr
          path: |
            utools/dist
            utools/plugin.json
            utools/preload.js
            utools/logo.png
          if-no-files-found: error

      - name: Package UPXS with organization secrets
        if: matrix.node == '22' && github.event_name != 'pull_request'
        uses: farfarfun-action/utools-devtools@c48e8ce06b6700d21c73917b3b16d6e5674c13ef # v0.1.4
        with:
          source: utools
          output: release/utools-funqr.upxs
          identity-file: identity.json
          mid: ${{ secrets.UTOOLS_MID }}
          uid: ${{ secrets.UTOOLS_UID }}
          cellphone: ${{ secrets.UTOOLS_CELLPHONE }}
      - name: Checksum UPXS
        if: matrix.node == '22' && github.event_name != 'pull_request'
        run: cd release && sha256sum utools-funqr.upxs > SHA256SUMS
      - name: Upload UPXS installation preview
        if: matrix.node == '22' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: utools-funqr-upxs
          path: release/
          if-no-files-found: error
